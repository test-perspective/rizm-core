[package]
name = "keel-backend"
version = "0.14.0"
edition = "2021"

[lib]
name = "keel_backend"
path = "src/lib.rs"

[[bin]]
name = "keel_backend"
path = "src/main.rs"

[[bin]]
name = "keel_seed_demo"
path = "src/bin/keel_seed_demo.rs"

[[bin]]
name = "keel_delete_project"
path = "src/bin/keel_delete_project.rs"

[[bin]]
name = "keel_backfill_jira_markdown"
path = "src/bin/keel_backfill_jira_markdown.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.7", features = ["multipart"] }
axum-extra = { version = "0.9", features = ["cookie"] }
bytes = "1.6"
base64 = "0.22"
argon2 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
r2d2 = "0.8"
r2d2_sqlite = "0.25"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
sqlite-vec = "0.1.7-alpha.2"
fastembed = "5.8.1"
zerocopy = "0.7"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.37", features = ["macros", "rt-multi-thread", "signal", "fs"] }
tokio-stream = "0.1"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.8", features = ["serde", "v4"] }
url = "2.5"
zip = "0.6"
sha2 = "0.10.9"
urlencoding = "2.1.3"

[dev-dependencies]
tempfile = "3.10"
